<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title description">
  <title id="title">Harbor Lane Delivery organization map</title>
  <desc id="description">The General Manager leads the Dispatch Coordinator and Safety Officer. Dispatch sends safety handoffs to the Safety Officer.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="1200" height="500" rx="24" fill="#0d1117" />
  <text x="600" y="42" fill="#f0f6fc" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="600" text-anchor="middle">Harbor Lane Delivery</text>

  <path d="M 600 205 L 600 250 L 300 250 L 300 315" fill="none" stroke="#8b949e" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M 600 205 L 600 250 L 900 250 L 900 315" fill="none" stroke="#8b949e" stroke-width="3" marker-end="url(#arrow)" />
  <path d="M 540 385 L 650 385" fill="none" stroke="#58a6ff" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)" />
  <text x="595" y="372" fill="#8b949e" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" text-anchor="middle">Safety handoff</text>

  <g filter="url(#shadow)">
    <rect x="350" y="72" width="500" height="133" rx="16" fill="#161b22" stroke="#30363d" stroke-width="2" />
    <rect x="350" y="72" width="8" height="133" rx="4" fill="#a371f7" />
    <text x="390" y="112" fill="#8b949e" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15">LEADERSHIP</text>
    <text x="390" y="148" fill="#f0f6fc" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="27" font-weight="600">General Manager</text>
    <text x="390" y="178" fill="#c9d1d9" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17">Company priorities and final escalations</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="60" y="315" width="480" height="135" rx="16" fill="#161b22" stroke="#30363d" stroke-width="2" />
    <rect x="60" y="315" width="8" height="135" rx="4" fill="#58a6ff" />
    <text x="100" y="355" fill="#8b949e" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15">OPERATIONS</text>
    <text x="100" y="391" fill="#f0f6fc" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="27" font-weight="600">Dispatch Coordinator</text>
    <text x="100" y="421" fill="#c9d1d9" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17">Daily dispatch and delivery exceptions</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="660" y="315" width="480" height="135" rx="16" fill="#161b22" stroke="#30363d" stroke-width="2" />
    <rect x="660" y="315" width="8" height="135" rx="4" fill="#3fb950" />
    <text x="700" y="355" fill="#8b949e" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15">SAFETY</text>
    <text x="700" y="391" fill="#f0f6fc" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="27" font-weight="600">Safety Officer</text>
    <text x="700" y="421" fill="#c9d1d9" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17">Field safety and stop-work authority</text>
  </g>
</svg>

